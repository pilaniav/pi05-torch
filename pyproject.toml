[project]
name = "pi05-torch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "av>=14",                     # PyAV (bundled FFmpeg): decode + re-encode in prepare
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "pyarrow>=17",                # parquet
    "safetensors>=0.8.0",
    "torch>=2.11",
    "torchcodec>=0.12",           # frame-exact video reads; needs system FFmpeg 4-9
    "transformers==4.53.2",
    "tyro>=1.0.16",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi05"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
